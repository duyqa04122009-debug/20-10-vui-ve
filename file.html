<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Món Quà Bất Ngờ 💗</title>
  <script src="[cdnjs.cloudflare.com](https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js)"></script>
  <script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js)"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #05020a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }

    #webgl-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    /* Lớp phủ màn hình & Form */
    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      background: radial-gradient(circle at center, rgba(30,10,35,0.85) 0%, rgba(5,2,10,0.95) 100%);
      z-index: 10; backdrop-filter: blur(10px);
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .card-panel {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 182, 193, 0.25);
      border-radius: 20px; padding: 25px 30px; width: 90%; max-width: 440px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px rgba(255,105,180,0.2);
      text-align: center; max-height: 90vh; overflow-y: auto;
    }
    .card-panel h2 { margin-bottom: 15px; color: #ff77a9; font-size: 1.5rem; text-shadow: 0 0 10px #ff3377; }
    .card-panel p { font-size: 0.9rem; color: #ddd; margin-bottom: 18px; line-height: 1.4; }

    .input-group { margin-bottom: 12px; text-align: left; }
    .input-group label { display: block; font-size: 0.8rem; color: #ffb6c1; margin-bottom: 4px; }
    .input-group input, .input-group textarea {
      width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.4); color: #fff; font-size: 0.95rem; outline: none; transition: 0.3s;
    }
    .input-group input:focus, .input-group textarea:focus { border-color: #ff69b4; box-shadow: 0 0 10px rgba(255,105,180,0.4); }

    .btn-main {
      width: 100%; padding: 12px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #ff4d88, #ff85a2);
      color: white; font-weight: bold; font-size: 1rem; cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,77,136,0.4); transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }
    .btn-main:active { transform: scale(0.98); }

    /* Canvas cho hiệu ứng tan biến chữ hạt */
    #text-particle-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 5; pointer-events: none;
    }

    /* Lời chúc hiển thị ở góc */
    #greeting-bubble {
      position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
      background: rgba(20, 5, 20, 0.7); border: 1px solid rgba(255,105,180,0.4);
      padding: 12px 24px; border-radius: 30px; font-size: 0.95rem; color: #ffcce0;
      z-index: 2; pointer-events: none; text-align: center; max-width: 85%;
      box-shadow: 0 0 15px rgba(255,105,180,0.3); backdrop-filter: blur(5px);
      transition: opacity 1s ease; opacity: 0;
    }
    #zoom-hint {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      font-size: 0.8rem; color: rgba(255,255,255,0.5); z-index: 2; pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>
  <canvas id="text-particle-canvas"></canvas>

  <div id="zoom-hint">🔍 Cuộn chuột hoặc chụm 2 ngón tay để phóng to/thu nhỏ & bay vào trong quả cầu</div>
  <div id="greeting-bubble"></div>

  <!-- BƯỚC 1: FORM TẠO (Hiển thị khi chưa có thông tin trong URL) -->
  <div id="create-modal" class="overlay">
    <div class="card-panel">
      <h2>💌 Tạo Lời Chúc 3D</h2>
      <p>Không lưu server • Mã hoá trực tiếp trong đường link</p>

      <div class="input-group">
        <label>Mật khẩu mở quà (4-12 số):</label>
        <input type="password" id="input-pass" placeholder="VD: 2010" maxlength="12">
      </div>
      <div class="input-group">
        <label>Chữ hiệu ứng 1 (xuất hiện đầu tiên):</label>
        <input type="text" id="input-text1" placeholder="Mặc định: Chúc mừng" value="Chúc mừng">
      </div>
      <div class="input-group">
        <label>Chữ hiệu ứng 2 (ghép sau khi chữ 1 tan biến - có thể để trống):</label>
        <input type="text" id="input-text2" placeholder="VD: 20/10 Ngày Phụ Nữ VN">
      </div>
      <div class="input-group">
        <label>Chữ chạy vòng tròn quanh trái tim 3D:</label>
        <input type="text" id="input-orbit-text" placeholder="VD: Yêu em mãi mãi 💗 " value="Happy Vietnamese Women's Day 💗 ">
      </div>
      <div class="input-group">
        <label>Lời chúc hiển thị bên dưới:</label>
        <textarea id="input-msg" rows="2" placeholder="Lời chúc ngọt ngào nhất..."></textarea>
      </div>
      <div class="input-group">
        <label>Chọn ảnh kỷ niệm tạo quả địa cầu (Tối đa 8 ảnh):</label>
        <input type="file" id="input-imgs" accept="image/*" multiple>
      </div>

      <button class="btn-main" id="btn-generate">🎉 Tạo & Sao Chép Link</button>
    </div>
  </div>

  <!-- BƯỚC 2: MÀN HÌNH NHẬP MẬT KHẨU (Cho người nhận) -->
  <div id="unlock-modal" class="overlay hidden">
    <div class="card-panel">
      <h2>🔒 Có Điều Bất Ngờ Dành Cho Bạn</h2>
      <p>Nhập mật khẩu số để mở khóa món quà</p>
      <div class="input-group">
        <input type="password" id="unlock-pass" placeholder="Nhập mật khẩu tại đây..." style="text-align: center; font-size: 1.2rem; letter-spacing: 4px;">
      </div>
      <button class="btn-main" id="btn-unlock">Mở Quà 💗</button>
    </div>
  </div>

  <script>
    // --- CẤU HÌNH & DỮ LIỆU ---
    let appData = {
      pass: "2010",
      text1: "Chúc mừng",
      text2: "Ngày Phụ Nữ Việt Nam 20/10",
      orbitText: "Mãi yêu em 💗 Luôn xinh đẹp & hạnh phúc nhé 💗 ",
      msg: "Chúc bạn luôn rực rỡ và ngập tràn niềm vui!",
      images: []
    };

    // Kiểm tra URL hash xem có dữ liệu gửi qua link không
    const hashData = window.location.hash.substring(1);
    const isReceiver = !!hashData;

    if (isReceiver) {
      try {
        const decoded = JSON.parse(decodeURIComponent(escape(atob(hashData))));
        appData = Object.assign(appData, decoded);
        document.getElementById('create-modal').classList.add('hidden');
        document.getElementById('unlock-modal').classList.remove('hidden');
      } catch (e) {
        alert("Link quà tặng không hợp lệ hoặc đã hỏng!");
      }
    }

    // --- XỬ LÝ NÉN ẢNH BASE64 ---
    const imageFilesInput = document.getElementById('input-imgs');
    let loadedImageBase64 = [];
    imageFilesInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).slice(0, 8);
      loadedImageBase64 = [];
      for (const file of files) {
        const b64 = await resizeImage(file, 250, 250);
        loadedImageBase64.push(b64);
      }
    });

    function resizeImage(file, maxWidth, maxHeight) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = maxWidth; canvas.height = maxHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, maxWidth, maxHeight);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // Tạo link
    document.getElementById('btn-generate').addEventListener('click', () => {
      const pass = document.getElementById('input-pass').value.trim();
      if (!pass) return alert("Vui lòng đặt mật khẩu số!");

      appData.pass = pass;
      appData.text1 = document.getElementById('input-text1').value.trim() || "Chúc mừng";
      appData.text2 = document.getElementById('input-text2').value.trim();
      appData.orbitText = document.getElementById('input-orbit-text').value.trim() || "Happy Women's Day 💗 ";
      appData.msg = document.getElementById('input-msg').value.trim() || "Chúc bạn luôn vui vẻ!";
      appData.images = loadedImageBase64;

      const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(appData))));
      const shareUrl = window.location.origin + window.location.pathname + "#" + encoded;
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert("Đã sao chép link quà tặng vào bộ nhớ đệm! Hãy gửi link này cho người ấy.");
      });
    });

    // Mở khóa mật khẩu
    document.getElementById('btn-unlock').addEventListener('click', () => {
      const inputPass = document.getElementById('unlock-pass').value.trim();
      if (inputPass === appData.pass) {
        document.getElementById('unlock-modal').classList.add('hidden');
        startTextParticleIntro();
      } else {
        alert("Mật khẩu không chính xác, thử lại nhé!");
      }
    });

    // --- HIỆU ỨNG CHỮ HẠT TAN BIẾN (CANVAS 2D) ---
    const pCanvas = document.getElementById('text-particle-canvas');
    const pCtx = pCanvas.getContext('2d');
    let particles = [];
    let particleAnimationId;

    function resizeParticleCanvas() {
      pCanvas.width = window.innerWidth;
      pCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeParticleCanvas);
    resizeParticleCanvas();

    class TextParticle {
      constructor(x, y, color) {
        this.originX = x;
        this.originY = y;
        this.x = Math.random() * pCanvas.width;
        this.y = Math.random() * pCanvas.height;
        this.vx = 0;
        this.vy = 0;
        this.size = 2;
        this.color = color || '#ff80bf';
        this.friction = 0.88;
        this.ease = 0.05;
      }
      update(targetX, targetY) {
        const dx = targetX - this.x;
        const dy = targetY - this.y;
        this.vx += dx * this.ease;
        this.vy += dy * this.ease;
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.x += this.vx;
        this.y += this.vy;
      }
      explode() {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 12 + 4;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
      }
      draw() {
        pCtx.fillStyle = this.color;
        pCtx.beginPath();
        pCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        pCtx.fill();
      }
    }

    function getTextCoordinates(text) {
      const offCanvas = document.createElement('canvas');
      offCanvas.width = pCanvas.width;
      offCanvas.height = pCanvas.height;
      const offCtx = offCanvas.getContext('2d');
      const fontSize = Math.min(pCanvas.width / (text.length * 0.75), 75);
      offCtx.font = `bold ${fontSize}px 'Segoe UI', Arial`;
      offCtx.fillStyle = 'white';
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      offCtx.fillText(text, offCanvas.width / 2, offCanvas.height / 2);

      const imgData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
      const points = [];
      const step = 4;
      for (let y = 0; y < imgData.height; y += step) {
        for (let x = 0; x < imgData.width; x += step) {
          const index = (y * imgData.width + x) * 4;
          if (imgData.data[index + 3] > 128) {
            points.push({ x, y });
          }
        }
      }
      return points;
    }

    function startTextParticleIntro() {
      const text1 = appData.text1;
      const text2 = appData.text2;
      const pts1 = getTextCoordinates(text1);

      particles = pts1.map(p => new TextParticle(p.x, p.y, '#ff4d94'));

      let phase = 1; // 1: tụ chữ 1, 2: nổ chữ 1, 3: tụ chữ 2, 4: tan hoàn toàn
      let timer = 0;
      let pts2 = text2 ? getTextCoordinates(text2) : [];

      function animateParticles() {
        pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
        timer++;

        if (phase === 1) {
          for (let i = 0; i < particles.length; i++) {
            particles[i].update(pts1[i].x, pts1[i].y);
            particles[i].draw();
          }
          if (timer > 140) { // Giữ chữ 1 khoảng 2.5s
            phase = 2;
            timer = 0;
            particles.forEach(p => p.explode());
          }
        } else if (phase === 2) {
          particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            p.draw();
          });
          if (timer > 40) {
            if (text2 && pts2.length > 0) {
              phase = 3;
              timer = 0;
              // Đồng bộ số lượng hạt cho chữ 2
              while (particles.length < pts2.length) {
                particles.push(new TextParticle(0, 0, '#ff99c8'));
              }
            } else {
              phase = 4;
            }
          }
        } else if (phase === 3) {
          for (let i = 0; i < pts2.length; i++) {
            particles[i].update(pts2[i].x, pts2[i].y);
            particles[i].draw();
          }
          if (timer > 150) {
            phase = 4;
            particles.forEach(p => p.explode());
          }
        } else if (phase === 4) {
          let alive = false;
          particles.forEach(p => {
            p.x += p.vx; p.y += p.vy;
            p.size *= 0.95;
            if (p.size > 0.1) {
              alive = true;
              p.draw();
            }
          });
          if (!alive) {
            cancelAnimationFrame(particleAnimationId);
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            initThreeScene();
            return;
          }
        }
        particleAnimationId = requestAnimationFrame(animateParticles);
      }
      animateParticles();
    }

    // --- THREE.JS: QUẢ ĐỊA CẦU ẢNH + TRÁI TIM + VÒNG CHỮ ---
    function initThreeScene() {
      const container = document.getElementById('webgl-canvas');
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x05020a, 0.002);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.set(0, 0, 320); // Vị trí nhìn toàn cảnh quả cầu

      const renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // OrbitControls cho phép tự do xoay, phóng to, thu nhỏ và bay vào trong
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 15;  // Có thể zoom tận tâm trái tim
      controls.maxDistance = 600; // Khoảng cách zoom ra xa nhất

      // Ánh sáng
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);
      const pointLight = new THREE.PointLight(0xff69b4, 2, 600);
      scene.add(pointLight);

      // 1. Quả địa cầu ảnh (Photo Sphere)
      const globeRadius = 180;
      const photoGroup = new THREE.Group();
      scene.add(photoGroup);

      const photoList = appData.images.length > 0 ? appData.images : [
        '[images.unsplash.com](https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=300)',
        '[images.unsplash.com](https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=300)'
      ];

      // Phân bố ảnh đều trên mặt cầu theo toạ độ cầu Fibonacci
      const totalCards = 28; // Số lượng khung ảnh bao quanh quả cầu
      const planeGeo = new THREE.PlaneGeometry(32, 32);

      for (let i = 0; i < totalCards; i++) {
        const phi = Math.acos(-1 + (2 * i) / totalCards);
        const theta = Math.sqrt(totalCards * Math.PI) * phi;

        const x = globeRadius * Math.cos(theta) * Math.sin(phi);
        const y = globeRadius * Math.sin(theta) * Math.sin(phi);
        const z = globeRadius * Math.cos(phi);

        const imgUrl = photoList[i % photoList.length];
        const texture = new THREE.TextureLoader().load(imgUrl);
        const mat = new THREE.MeshBasicMaterial({ 
          map: texture, 
          side: THREE.DoubleSide, 
          transparent: true,
          opacity: 0.9 
        });

        const mesh = new THREE.Mesh(planeGeo, mat);
        mesh.position.set(x, y, z);
        mesh.lookAt(0, 0, 0); // Hướng vào tâm hoặc ra ngoài
        photoGroup.add(mesh);
      }

      // 2. Trái tim 3D phát sáng ở trung tâm
      const heartPoints = [];
      for (let t = -Math.PI; t <= Math.PI; t += 0.03) {
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        heartPoints.push(new THREE.Vector3(hx * 1.5, hy * 1.5, (Math.random() - 0.5) * 8));
      }
      const heartGeo = new THREE.BufferGeometry().setFromPoints(heartPoints);
      const heartMat = new THREE.PointsMaterial({ color: 0xff1493, size: 2.8, transparent: true, blending: THREE.AdditiveBlending });
      const heartMesh = new THREE.Points(heartGeo, heartMat);
      scene.add(heartMesh);

      // Đám bụi sao hạt bao quanh trái tim
      const starGeo = new THREE.BufferGeometry();
      const starCount = 600;
      const starPos = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount * 3; i++) {
        starPos[i] = (Math.random() - 0.5) * 120;
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
      const starMat = new THREE.PointsMaterial({ color: 0xffb6c1, size: 1.5, transparent: true });
      const starField = new THREE.Points(starGeo, starMat);
      scene.add(starField);

      // 3. Vòng chữ chạy xung quanh trái tim (Orbiting Text Ring)
      function createTextRingTexture(text) {
        const canvas = document.createElement('canvas');
        canvas.width = 1024; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(0,0,0,0)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = 'bold 36px "Segoe UI", sans-serif';
        ctx.fillStyle = '#ff66b2';
        ctx.shadowColor = '#ff1493';
        ctx.shadowBlur = 10;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText((text + "   ").repeat(3), canvas.width / 2, canvas.height / 2);
        return new THREE.CanvasTexture(canvas);
      }

      const ringTex = createTextRingTexture(appData.orbitText);
      ringTex.wrapS = THREE.RepeatWrapping;
      ringTex.wrapT = THREE.RepeatWrapping;

      const ringGeo = new THREE.CylinderGeometry(55, 55, 14, 64, 1, true);
      const ringMat = new THREE.MeshBasicMaterial({ 
        map: ringTex, 
        side: THREE.DoubleSide, 
        transparent: true, 
        opacity: 0.95 
      });
      const textRing = new THREE.Mesh(ringGeo, ringMat);
      textRing.rotation.x = 0.2; // Nghiêng nhẹ vòng chữ
      scene.add(textRing);

      // Hiển thị khung lời chúc
      const bubble = document.getElementById('greeting-bubble');
      bubble.textContent = appData.msg;
      bubble.style.opacity = '1';

      // Vòng lặp Render & Animation
      let clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const elapsedTime = clock.getElapsedTime();

        // Xoay nhẹ quả cầu ảnh
        photoGroup.rotation.y += 0.002;
        photoGroup.rotation.x = Math.sin(elapsedTime * 0.3) * 0.05;

        // Nhịp đập trái tim
        const beat = 1 + 0.08 * Math.sin(elapsedTime * 3.5);
        heartMesh.scale.set(beat, beat, beat);

        // Vòng chữ xoay tròn quanh trái tim
        textRing.rotation.y -= 0.008;
        ringTex.offset.x -= 0.002;

        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }
  </script>
</body>
</html>
